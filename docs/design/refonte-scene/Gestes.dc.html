<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Petits gestes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&amp;family=Instrument+Serif:ital@0;1&amp;display=swap">
<style>body{margin:0} @keyframes pg-pulse{0%,100%{opacity:1}50%{opacity:0.25}} .pg-pulse{animation:pg-pulse 1.2s ease-out infinite} .pg-fade{transition:opacity 160ms ease-out} @media (prefers-reduced-motion: reduce){.pg-pulse{animation:none}.pg-fade,.pg-bar{transition:none !important}}</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; padding: 26px 40px 0; background: {{t.app}}; color: {{t.body}}; font-family: 'Instrument Sans', system-ui, sans-serif">

  <header style="flex: none; display: flex; align-items: baseline; gap: 20px; padding-bottom: 20px">
    <h1 style="margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 34px; line-height: 1; color: {{t.strong}}">Petits gestes</h1>
    <span style="font-size: 13.5px; color: {{t.sec}}">Ce qui rend l'outil confortable, montré sur de vrais fragments de l'interface.</span>
    <span style="flex: 1"></span>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.1em; color: {{t.label}}">9 GESTES · THÈME NUIT</span>
  </header>

  <div style="flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); border-top: 1px solid {{t.hair}}">

    <!-- 1 · Enregistrement -->
    <figure style="margin: 0; min-width: 0; display: flex; flex-direction: column; gap: 14px; padding: 18px 20px 18px 0; border-right: 1px solid {{t.hair}}; border-bottom: 1px solid {{t.hair}}">
      <div style="flex: 1; min-height: 0; box-sizing: border-box; border: 1px solid {{t.hair2}}; border-radius: 8px; display: flex; flex-direction: column; justify-content: center; gap: 9px; padding: 14px; overflow: hidden">
        <div style="height: 28px; display: flex; align-items: center; gap: 20px; padding: 0 14px; border-radius: 6px; background: {{t.input}}; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.05em; color: {{t.muted}}">
          <span style="display: flex; align-items: center; gap: 7px; color: {{t.body}}"><span aria-hidden="true" class="pg-pulse" style="width: 6px; height: 6px; border-radius: 99px; background: {{t.accent}}"></span>ENREGISTREMENT…</span><span style="flex: 1"></span><span>PENDANT LA FRAPPE</span>
        </div>
        <div style="height: 28px; display: flex; align-items: center; gap: 20px; padding: 0 14px; border-radius: 6px; background: {{t.input}}; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.05em; color: {{t.muted}}">
          <span style="display: flex; align-items: center; gap: 7px; color: {{t.body}}"><span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 99px; background: {{t.ok}}"></span>ENREGISTRÉ · 11:24</span><span style="flex: 1"></span><span>AU REPOS</span>
        </div>
        <div style="height: 28px; display: flex; align-items: center; gap: 20px; padding: 0 14px; border-radius: 6px; background: {{t.input}}; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.05em; color: {{t.muted}}">
          <span style="display: flex; align-items: center; gap: 7px; color: {{t.pend}}"><span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 99px; background: {{t.pend}}"></span>HORS LIGNE — MODIFICATIONS GARDÉES</span>
        </div>
      </div>
      <figcaption style="flex: none; display: flex; flex-direction: column; gap: 5px">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.1em; color: {{t.label}}">01 — ÉTAT D'ENREGISTREMENT</span>
        <span style="font-size: 13px; line-height: 1.5; color: {{t.sec}}">L'état s'écrit en mono dans la barre d'état. Aucun bouton Enregistrer : tout est gardé au fil de la frappe.</span>
      </figcaption>
    </figure>

    <!-- 2 · Annulation -->
    <figure style="margin: 0; min-width: 0; display: flex; flex-direction: column; gap: 14px; padding: 18px 20px; border-right: 1px solid {{t.hair}}; border-bottom: 1px solid {{t.hair}}">
      <div style="flex: 1; min-height: 0; position: relative; box-sizing: border-box; border: 1px solid {{t.hair2}}; border-radius: 8px; padding: 9px 14px 0; overflow: hidden">
        <ol style="list-style: none; margin: 0; padding: 0; opacity: 0.55">
          <li style="display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; column-gap: 9px; padding: 7px 0; border-bottom: 1px solid {{t.hair}}">
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: {{t.muted}}">02</span>
            <span style="font-size: 13.5px; color: {{t.body}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Je ne cherche pas de confidences. Répare cette caravane…</span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; color: {{t.muted}}">4 À ÉCRIRE</span>
          </li>
          <li style="display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; column-gap: 9px; padding: 7px 0; border-bottom: 1px solid {{t.hair}}">
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: {{t.muted}}">03</span>
            <span style="font-size: 13.5px; color: {{t.body}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Garde tes mains pour tes villages. Je n'ai nul besoin…</span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; color: {{t.muted}}">4 ISSUES</span>
          </li>
          <sc-if value="{{undone}}" hint-placeholder-val="{{false}}">
            <li style="display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; column-gap: 9px; padding: 7px 0; border-bottom: 1px solid {{t.hair}}">
              <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: {{t.muted}}">04</span>
              <span style="font-size: 13.5px; font-style: italic; color: {{t.muted}}">Réponse vide</span>
              <span style="font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; color: {{t.pend}}">▲ VIDE</span>
            </li>
          </sc-if>
        </ol>
        <sc-if value="{{toast}}" hint-placeholder-val="{{true}}">
          <div role="status" style="position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; align-items: center; gap: 14px; padding: 0 5px 0 14px; height: 40px; border-radius: 8px; background: {{t.raised}}; border: 1px solid {{t.hair2}}; overflow: hidden; white-space: nowrap">
            <span style="font-size: 13px; color: {{t.strong}}">Réponse supprimée</span>
            <button type="button" onClick="{{undo}}" style="height: 30px; display: flex; align-items: center; gap: 9px; padding: 0 9px; border: none; border-radius: 6px; background: transparent; color: {{t.accText}}; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer">Annuler<span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 400; letter-spacing: 0.05em; color: {{t.sec}}">CTRL+Z</span></button>
            <span aria-hidden="true" style="position: absolute; left: 0; bottom: 0; height: 2px; width: 62%; background: {{t.accent}}; opacity: 0.6"></span>
          </div>
        </sc-if>
        <sc-if value="{{undone}}" hint-placeholder-val="{{false}}">
          <button type="button" onClick="{{redo}}" style="position: absolute; right: 14px; bottom: 14px; height: 28px; padding: 0 10px; border-radius: 6px; border: 1px solid {{t.ctrl}}; background: transparent; color: {{t.sec}}; font-family: inherit; font-size: 12px; cursor: pointer">Rejouer la suppression</button>
        </sc-if>
      </div>
      <figcaption style="flex: none; display: flex; flex-direction: column; gap: 5px">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.1em; color: {{t.label}}">02 — ANNULER PLUTÔT QUE CONFIRMER</span>
        <span style="font-size: 13px; line-height: 1.5; color: {{t.sec}}">Supprimer ne pose jamais de question : le toast propose d'annuler, et <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11.5px">CTRL+Z</span> marche encore après.</span>
      </figcaption>
    </figure>

    <!-- 3 · Variantes -->
    <figure style="margin: 0; min-width: 0; display: flex; flex-direction: column; gap: 14px; padding: 18px 0 18px 20px; border-bottom: 1px solid {{t.hair}}">
      <div style="flex: 1; min-height: 0; box-sizing: border-box; border: 1px solid {{t.hair2}}; border-radius: 8px; padding: 14px 18px; overflow: hidden">
        <div style="display: flex; align-items: center; gap: 9px; margin-bottom: 9px">
          <span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 99px; background: {{t.spk}}"></span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.09em; color: {{t.sec}}">GRISH T'VOK</span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.06em; color: {{t.pend}}">À VALIDER</span>
          <span style="flex: 1"></span>
          <span role="group" aria-label="Variantes" style="display: flex; align-items: center; gap: 2px; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.04em; color: {{t.body}}">
            <button type="button" onClick="{{prevVar}}" aria-label="Variante précédente" style="width: 26px; height: 26px; border: 1px solid {{t.ctrl}}; border-radius: 6px; background: transparent; color: {{t.body}}; font-size: 14px; line-height: 1; cursor: pointer">‹</button>
            <span style="min-width: 34px; text-align: center">{{varLabel}}</span>
            <button type="button" onClick="{{nextVar}}" aria-label="Variante suivante" style="width: 26px; height: 26px; border: 1px solid {{t.ctrl}}; border-radius: 6px; background: transparent; color: {{t.body}}; font-size: 14px; line-height: 1; cursor: pointer">›</button>
          </span>
        </div>
        <p class="pg-fade" style="margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-size: 18px; line-height: 1.5; color: {{t.dia}}">{{varText}}</p>
      </div>
      <figcaption style="flex: none; display: flex; flex-direction: column; gap: 5px">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.1em; color: {{t.label}}">03 — VARIANTES ‹ 2/3 ›</span>
        <span style="font-size: 13px; line-height: 1.5; color: {{t.sec}}">Régénérer ajoute une variante au lieu d'écraser : comparer, puis garder celle qui sonne juste.</span>
      </figcaption>
    </figure>

    <!-- 4 · Provenance -->
    <figure style="margin: 0; min-width: 0; display: flex; flex-direction: column; gap: 14px; padding: 18px 20px 18px 0; border-right: 1px solid {{t.hair}}; border-bottom: 1px solid {{t.hair}}">
      <div style="flex: 1; min-height: 0; box-sizing: border-box; border: 1px solid {{t.hair2}}; border-radius: 8px; padding: 14px 18px; display: flex; flex-direction: column; gap: 11px; overflow: hidden">
        <p style="margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-size: 18px; line-height: 1.55; color: {{t.dia}}"><span style="color: {{t.dia}}">Ha. Vos mots ont la précision d'une lime fine.</span> <span class="pg-fade" style="color: {{genColor}}; background: {{genBg}}; border-radius: 2px; -webkit-box-decoration-break: clone; box-decoration-break: clone">Vous ne cédez pas la toile, Maîtresse, vous la confiez à quelqu'un qui respecte la trame des cicatrices.</span></p>
        <div style="display: flex; align-items: center; gap: 14px; font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: 0.06em; color: {{t.muted}}">
          <span style="display: flex; align-items: center; gap: 7px"><span aria-hidden="true" style="width: 14px; height: 9px; border-radius: 2px; background: rgba(79,127,255,0.16)"></span>GÉNÉRÉ · GPT-6.2 SOL</span>
          <span style="display: flex; align-items: center; gap: 7px"><span aria-hidden="true" style="width: 14px; height: 9px; border-radius: 2px; border: 1px solid {{t.chip2}}; box-sizing: border-box"></span>RETOUCHÉ</span>
          <span style="flex: 1"></span>
          <button type="button" onClick="{{toggleAlt}}" aria-pressed="{{alt}}" style="height: 24px; padding: 0 8px; border-radius: 6px; border: 1px solid {{altBorder}}; background: {{altBg}}; color: {{t.body}}; font: inherit; letter-spacing: inherit; cursor: pointer">ALT</button>
        </div>
      </div>
      <figcaption style="flex: none; display: flex; flex-direction: column; gap: 5px">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.1em; color: {{t.label}}">04 — PROVENANCE DU TEXTE</span>
        <span style="font-size: 13px; line-height: 1.5; color: {{t.sec}}">Le texte généré garde une teinte froide tant que personne n'y a touché ; <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11.5px">ALT</span> la montre, le reste du temps elle s'efface.</span>
      </figcaption>
    </figure>

    <!-- 5 · Raccourcis -->
    <figure style="margin: 0; min-width: 0; display: flex; flex-direction: column; gap: 14px; padding: 18px 20px; border-right: 1px solid {{t.hair}}; border-bottom: 1px solid {{t.hair}}">
      <div style="flex: 1; min-height: 0; position: relative; box-sizing: border-box; border: 1px solid {{t.hair2}}; border-radius: 8px; padding: 14px; display: flex; gap: 14px; overflow: hidden">
        <div style="flex: none; display: flex; flex-direction: column; gap: 9px">
          <button type="button" style="height: 28px; display: flex; align-items: center; gap: 9px; padding: 0 10px; border-radius: 6px; border: 1px solid {{t.ctrl}}; background: transparent; color: {{t.body}}; font-family: inherit; font-size: 12.5px; cursor: pointer">Focus<span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.05em; color: {{t.label}}">CTRL+\</span></button>
          <button type="button" style="height: 28px; display: flex; align-items: center; gap: 9px; padding: 0 10px; border-radius: 6px; border: 1px solid {{t.ctrl}}; background: transparent; color: {{t.body}}; font-family: inherit; font-size: 12.5px; cursor: pointer">Réglages<span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.05em; color: {{t.label}}">CTRL+,</span></button>
          <span style="flex: 1"></span>
          <button type="button" onClick="{{toggleHelp}}" aria-expanded="{{help}}" style="height: 24px; align-self: flex-start; padding: 0 8px; border-radius: 6px; border: 1px solid {{helpBorder}}; background: transparent; color: {{t.muted}}; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.05em; cursor: pointer">? RACCOURCIS</button>
        </div>
        <sc-if value="{{help}}" hint-placeholder-val="{{true}}">
          <div role="dialog" aria-label="Raccourcis" class="pg-fade" style="flex: 1; min-width: 0; box-sizing: border-box; padding: 11px 14px; border-radius: 10px; border: 1px solid {{t.hair2}}; background: {{t.card}}">
            <div style="display: flex; justify-content: space-between; margin-bottom: 7px; font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: 0.1em; color: {{t.sec}}"><span>RACCOURCIS</span><span>ÉCHAP</span></div>
            <dl style="margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 11px; font-size: 12px; line-height: 1.35">
              <dt style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.04em; line-height: 16px; color: {{t.accText}}">CTRL+K</dt><dd style="margin: 0; color: {{t.body}}">Rechercher, aller à, demander</dd>
              <dt style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.04em; line-height: 16px; color: {{t.accText}}">CTRL+↵</dt><dd style="margin: 0; color: {{t.body}}">Générer la suite</dd>
              <dt style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.04em; line-height: 16px; color: {{t.accText}}">TAB</dt><dd style="margin: 0; color: {{t.body}}">Suite vide suivante</dd>
              <dt style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.04em; line-height: 16px; color: {{t.accText}}">ALT</dt><dd style="margin: 0; color: {{t.body}}">Tout voir</dd>
            </dl>
          </div>
        </sc-if>
        <sc-if value="{{noHelp}}" hint-placeholder-val="{{false}}">
          <p style="flex: 1; margin: 0; align-self: center; font-size: 12.5px; line-height: 1.5; color: {{t.sec}}">La feuille des raccourcis s'ouvre ici, à côté de l'action, sans quitter la scène.</p>
        </sc-if>
      </div>
      <figcaption style="flex: none; display: flex; flex-direction: column; gap: 5px">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.1em; color: {{t.label}}">05 — LE RACCOURCI DANS LE BOUTON</span>
        <span style="font-size: 13px; line-height: 1.5; color: {{t.sec}}">Chaque action porte son raccourci en mono, toujours en <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11.5px">CTRL</span>. <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11.5px">?</span> ouvre la feuille complète.</span>
      </figcaption>
    </figure>

    <!-- 6 · État vide -->
    <figure style="margin: 0; min-width: 0; display: flex; flex-direction: column; gap: 14px; padding: 18px 0 18px 20px; border-bottom: 1px solid {{t.hair}}">
      <div style="flex: 1; min-height: 0; position: relative; box-sizing: border-box; border: 1px solid {{t.hair2}}; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end">
        <div role="dialog" aria-label="Problèmes" style="margin: 0 14px 9px; padding: 11px 14px 14px; border-radius: 10px; border: 1px solid {{t.hair2}}; background: {{t.card}}">
          <div style="display: flex; justify-content: space-between; margin-bottom: 7px; font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: 0.1em; color: {{t.sec}}"><span>PROBLÈMES</span><span>0</span></div>
          <p style="margin: 0; font-size: 13px; line-height: 1.5; color: {{t.body}}">Aucun problème. Les erreurs de validation de l'export Unity s'afficheront ici, chacune avec un lien vers sa réplique.</p>
        </div>
        <div style="height: 28px; flex: none; display: flex; align-items: center; gap: 20px; padding: 0 14px; border-top: 1px solid {{t.hair}}; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.05em; color: {{t.muted}}">
          <span style="display: flex; align-items: center; gap: 7px"><span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 99px; background: {{t.ok}}"></span>ENREGISTRÉ · 11:24</span>
          <span style="color: {{t.body}}">0 PROBLÈME ▴</span>
        </div>
      </div>
      <figcaption style="flex: none; display: flex; flex-direction: column; gap: 5px">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.1em; color: {{t.label}}">06 — ÉTAT VIDE</span>
        <span style="font-size: 13px; line-height: 1.5; color: {{t.sec}}">Un panneau vide dit ce qui s'y affichera, jamais un simple « Rien ».</span>
      </figcaption>
    </figure>

    <!-- 7 · TAB -->
    <figure style="margin: 0; min-width: 0; display: flex; flex-direction: column; gap: 14px; padding: 18px 20px 18px 0; border-right: 1px solid {{t.hair}}">
      <div style="flex: 1; min-height: 0; box-sizing: border-box; border: 1px solid {{t.hair2}}; border-radius: 8px; padding: 11px 14px; display: flex; flex-direction: column; gap: 9px; overflow: hidden">
        <div style="display: flex; align-items: center; gap: 9px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.05em; color: {{t.muted}}">
          <span style="height: 20px; display: inline-flex; align-items: center; padding: 0 7px; border-radius: 4px; border: 1px solid {{t.chip2}}; border-bottom-width: 2px; color: {{t.strong}}">TAB</span>
          <span aria-hidden="true" style="color: {{t.label}}">→</span>
          <span>SUITE VIDE SUIVANTE</span>
          <span style="flex: 1"></span>
          <span style="color: {{t.body}}">2 / 209</span>
        </div>
        <section aria-label="Suite à écrire" style="flex: 1; min-height: 0; border: 1px dashed {{t.chip2}}; border-radius: 8px; padding: 9px 14px 11px; display: flex; flex-direction: column; justify-content: space-between; gap: 7px; box-shadow: 0 0 0 3px rgba(79,127,255,0.14)">
          <div style="display: flex; align-items: center; gap: 9px; font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: 0.06em; color: {{t.label}}"><span aria-hidden="true" style="width: 14px; height: 1px; background: {{t.hair2}}"></span>RÉPONSE 02 · É. CRIT — À ÉCRIRE</div>
          <p style="margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-size: 17px; line-height: 1.4; color: {{t.muted}}"><span aria-hidden="true" style="display: inline-block; width: 1.5px; height: 17px; margin-right: 3px; vertical-align: -3px; background: {{t.accent}}"></span>Écrire la réplique de Grish…</p>
          <div style="display: flex; align-items: center; gap: 14px">
            <button type="button" style="height: 30px; display: flex; align-items: center; gap: 9px; padding: 0 12px; border: none; border-radius: 6px; background: {{t.fill}}; color: #ffffff; font-family: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer">Générer la suite<span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 400; letter-spacing: 0.05em">CTRL+↵</span></button>
            <span style="font-size: 12px; color: {{t.sec}}">ou taper directement</span>
          </div>
        </section>
      </div>
      <figcaption style="flex: none; display: flex; flex-direction: column; gap: 5px">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.1em; color: {{t.label}}">07 — TAB, LA SUITE VIDE SUIVANTE</span>
        <span style="font-size: 13px; line-height: 1.5; color: {{t.sec}}"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11.5px">TAB</span> saute à la prochaine suite à écrire, curseur posé ; <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11.5px">CTRL+↵</span> la fait proposer.</span>
      </figcaption>
    </figure>

    <!-- 8 · Taille du texte -->
    <figure style="margin: 0; min-width: 0; display: flex; flex-direction: column; gap: 14px; padding: 18px 20px; border-right: 1px solid {{t.hair}}">
      <div style="flex: 1; min-height: 0; box-sizing: border-box; border: 1px solid {{t.hair2}}; border-radius: 8px; padding: 11px 14px; display: flex; flex-direction: column; gap: 9px; overflow: hidden">
        <div style="display: flex; align-items: center; gap: 5px">
          <button type="button" aria-label="Réduire le texte" onClick="{{smaller}}" style="width: 28px; height: 28px; border-radius: 6px; border: 1px solid {{t.ctrl}}; background: transparent; color: {{t.body}}; font-family: inherit; font-size: 12px; cursor: pointer">A−</button>
          <button type="button" aria-label="Agrandir le texte" onClick="{{bigger}}" style="width: 28px; height: 28px; border-radius: 6px; border: 1px solid {{t.ctrl}}; background: transparent; color: {{t.body}}; font-family: inherit; font-size: 14px; cursor: pointer">A+</button>
          <span style="width: 9px"></span>
          <span aria-hidden="true" style="flex: 1; position: relative; height: 2px; border-radius: 2px; background: {{t.chip}}"><span class="pg-bar" style="position: absolute; left: 0; top: 0; bottom: 0; width: {{fsPct}}%; border-radius: 2px; background: {{t.accent}}; transition: width 100ms ease-out"></span></span>
          <span style="width: 9px"></span>
          <output style="min-width: 44px; text-align: right; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: {{t.strong}}">{{fsText}}</output>
        </div>
        <p style="margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-size: {{fs}}px; line-height: 1.5; color: {{t.dia}}">Ha. Vos mots ont la précision d'une lime fine. Vous ne cédez pas la toile, Maîtresse.</p>
      </div>
      <figcaption style="flex: none; display: flex; flex-direction: column; gap: 5px">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.1em; color: {{t.label}}">08 — TAILLE DU TEXTE A− / A+</span>
        <span style="font-size: 13px; line-height: 1.5; color: {{t.sec}}">Seules les répliques grandissent, de <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11.5px">16</span> à <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11.5px">24 PX</span> ; l'interface ne bouge pas, le choix est gardé.</span>
      </figcaption>
    </figure>

    <!-- 9 · Mouvement -->
    <figure style="margin: 0; min-width: 0; display: flex; flex-direction: column; gap: 14px; padding: 18px 0 18px 20px">
      <div style="flex: 1; min-height: 0; box-sizing: border-box; border: 1px solid {{t.hair2}}; border-radius: 8px; padding: 11px 14px; display: flex; flex-direction: column; justify-content: center; gap: 9px; overflow: hidden">
        <sc-for list="{{motion}}" as="m" hint-placeholder-count="3">
          <div style="display: grid; grid-template-columns: 52px 150px minmax(0, 1fr); column-gap: 11px; align-items: center">
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.04em; color: {{t.strong}}">{{m.ms}}</span>
            <span style="position: relative; height: 6px; border-radius: 99px; background: {{t.input}}"><span class="pg-bar" style="position: absolute; left: 0; top: 0; bottom: 0; width: {{m.w}}%; border-radius: 99px; background: {{t.accent}}; transition: {{m.tr}}"></span></span>
            <span style="font-size: 12px; color: {{t.sec}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{m.use}}</span>
          </div>
        </sc-for>
        <div style="display: flex; align-items: center; gap: 9px; padding-top: 7px; border-top: 1px solid {{t.hair}}">
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: 0.06em; color: {{t.muted}}">{{motionNote}}</span>
          <span style="flex: 1"></span>
          <button type="button" onClick="{{toggleReduce}}" aria-pressed="{{reduce}}" style="height: 24px; padding: 0 8px; border-radius: 6px; border: 1px solid {{reduceBorder}}; background: {{reduceBg}}; color: {{t.body}}; font-family: inherit; font-size: 11.5px; cursor: pointer">Mouvement réduit</button>
          <button type="button" onClick="{{replay}}" style="height: 24px; padding: 0 8px; border-radius: 6px; border: 1px solid {{t.ctrl}}; background: transparent; color: {{t.body}}; font-family: inherit; font-size: 11.5px; cursor: pointer">Rejouer</button>
        </div>
      </div>
      <figcaption style="flex: none; display: flex; flex-direction: column; gap: 5px">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.1em; color: {{t.label}}">09 — MOUVEMENT</span>
        <span style="font-size: 13px; line-height: 1.5; color: {{t.sec}}">Seulement la largeur et l'opacité, en ease-out. En mouvement réduit, tout arrive d'un coup.</span>
      </figcaption>
    </figure>
  </div>

  <p style="flex: none; margin: 0; padding: 9px 0 12px; font-size: 12px; line-height: 1.5; color: #9a9aa4">Exemple : variantes <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px">1</span> et <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px">3</span>, partage généré / retouché, heure <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px">11:24</span>, rang <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px">2 / 209</span>. Répliques et réponses réelles (scène du forgeron).</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { v: 1, fs: 19, alt: true, help: true, undone: false, reduce: false, play: true };
    this.t = {
      app: '#17171b', input: '#1c1c22', raised: '#2a2a33', card: '#1f1f26', hair: 'rgba(255,255,255,0.06)', hair2: 'rgba(255,255,255,0.09)',
      chip: 'rgba(255,255,255,0.12)', chip2: 'rgba(255,255,255,0.22)', strong: '#f2f2f5', body: '#dcdce4', dia: '#f0efe9',
      sec: '#9a9aa4', muted: '#8a8a95', label: '#84848f', accent: '#4f7fff', accText: '#8fb0ff', selBg: 'rgba(79,127,255,0.08)',
      fill: '#3d6ae8', ok: '#27ae60', pend: '#f5a623', err: '#ff6b6b', ctrl: '#2e2e36', spk: '#5fb8ac'
    };
    this.VARS = [
      'Soit. Je range mes outils, Maîtresse. Une main que l’on repousse n’a plus rien à recoudre.',
      "Hmph. Soit. Votre fermeté est notée, Maîtresse. Je ne forcerai pas le contact quand on me le refuse — et je ne mendie pas d'affections.",
      'Hmph. Refuser, c’est votre droit. Garder vos fissures aussi : je ne touche que ce qu’on me tend.'
    ];
  }

  componentWillUnmount() {
    clearTimeout(this.tp);
  }

  renderVals() {
    const t = this.t;
    const s = this.state;
    const ms = [[100, 'survol, pression d’un bouton'], [160, 'popover, toast, variante'], [240, 'tiroir, changement de vue']];
    const motion = ms.map((m) => ({
      ms: s.reduce ? '0 MS' : m[0] + ' MS',
      use: m[1],
      w: s.play ? Math.round((m[0] / 240) * 100) : 0,
      tr: s.reduce ? 'none' : 'width ' + m[0] + 'ms ease-out'
    }));
    return {
      t: t,
      varLabel: (s.v + 1) + '/3',
      varText: this.VARS[s.v],
      prevVar: () => this.setState({ v: (s.v + 2) % 3 }),
      nextVar: () => this.setState({ v: (s.v + 1) % 3 }),
      fs: s.fs,
      fsText: s.fs + ' PX',
      fsPct: Math.round(((s.fs - 16) / 8) * 100),
      smaller: () => this.setState({ fs: Math.max(16, s.fs - 1) }),
      bigger: () => this.setState({ fs: Math.min(24, s.fs + 1) }),
      alt: s.alt,
      genColor: s.alt ? '#c9d3f0' : t.dia,
      genBg: s.alt ? 'rgba(79,127,255,0.16)' : 'transparent',
      altBorder: s.alt ? t.accent : t.ctrl,
      altBg: s.alt ? t.selBg : 'transparent',
      toggleAlt: () => this.setState({ alt: !s.alt }),
      help: s.help,
      noHelp: !s.help,
      helpBorder: s.help ? t.accent : t.ctrl,
      toggleHelp: () => this.setState({ help: !s.help }),
      toast: !s.undone,
      undone: s.undone,
      undo: () => this.setState({ undone: true }),
      redo: () => this.setState({ undone: false }),
      motion: motion,
      reduce: s.reduce,
      reduceBorder: s.reduce ? t.accent : t.ctrl,
      reduceBg: s.reduce ? t.selBg : 'transparent',
      motionNote: s.reduce ? 'RIEN NE BOUGE' : 'EASE-OUT · LARGEUR, OPACITÉ',
      toggleReduce: () => this.setState({ reduce: !s.reduce }),
      replay: () => {
        this.setState({ play: false });
        clearTimeout(this.tp);
        this.tp = setTimeout(() => this.setState({ play: true }), 60);
      }
    };
  }
}
</script>
