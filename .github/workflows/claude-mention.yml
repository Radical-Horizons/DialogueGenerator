# Mode interactif : écrire `@claude …` dans une PR ou une issue. Claude lit le
# contexte, répond, et peut pousser un commit correctif sur la branche de la PR.
#
# Complète claude-review.yml (revue automatique, une seule fois à l'ouverture) :
# c'est ici qu'on relance une revue après corrections, ou qu'on demande un fix.
#
# Prérequis : secret de dépôt `ANTHROPIC_API_KEY`. Sans lui, job vert sans effet.
name: Claude — @mention

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-mention-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  respond:
    # Filtre en amont pour ne pas démarrer un runner à chaque commentaire du dépôt.
    if: |
      contains(github.event.comment.body, '@claude')
      || contains(github.event.review.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Vérifier la présence de la clé API
        id: guard
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY absent — @claude désactivé."
          fi

      - uses: actions/checkout@v6
        if: steps.guard.outputs.enabled == 'true'
        with:
          fetch-depth: 0

      # Pas de `prompt:` ici : sans lui l'action tourne en mode interactif et
      # prend le commentaire de l'utilisateur comme instruction.
      - uses: anthropics/claude-code-action@v1
        if: steps.guard.outputs.enabled == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: "@claude"
          track_progress: true
          claude_args: |
            --model claude-opus-5
            --max-turns 40
