# Mode interactif : écrire `@claude …` dans une PR ou une issue. Claude lit le
# contexte, répond, et peut pousser un commit correctif sur la branche de la PR.
#
# Complète claude-review.yml (revue automatique, une seule fois à l'ouverture) :
# c'est ici qu'on relance une revue après corrections, ou qu'on demande un fix.
#
# Prérequis : secret de dépôt `ANTHROPIC_API_KEY`. Sans lui, job vert sans effet.
name: Claude — @mention

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-mention-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  respond:
    # Filtre en amont pour ne pas démarrer un runner à chaque commentaire du dépôt.
    #
    # Garde anti-boucle. L'anti-récursion de GitHub ne couvre QUE ce que postent
    # les workflows avec GITHUB_TOKEN — vérifié sur la PR #55 : les revues du bot
    # (19:59–20:00) ont déclenché 0 run, les réponses d'une session Claude Code
    # postées sous un compte utilisateur (21:03) en ont déclenché 8. Une session
    # agent écrivant sous un PAT est un utilisateur normal aux yeux de GitHub :
    # rien ne l'empêche de se réveiller elle-même en écrivant `@claude`.
    #
    # Ce workflow tourne en `contents: write` et n'a pas d'équivalent du garde
    # « une tentative par commit humain » de claude-ci-fix. On filtre donc à la
    # source, sur deux signaux indépendants du jeton employé :
    #   - `sender.type != 'Bot'` : commentaires d'App / bot ;
    #   - `[Claude Code](` : le lien du pied de page d'attribution, présent dans
    #     « Generated by » comme dans « Addressed by », quel que soit le compte
    #     qui poste.
    #
    # Parenthèses obligatoires : dans les expressions GitHub `&&` lie plus fort
    # que `||`, donc sans elles le premier `contains` échapperait aux gardes.
    if: >-
      (
        contains(github.event.comment.body, '@claude')
        || contains(github.event.review.body, '@claude')
      )
      && github.event.sender.type != 'Bot'
      && !contains(github.event.comment.body, '[Claude Code](')
      && !contains(github.event.review.body, '[Claude Code](')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      # Permet de relancer la CI après un correctif poussé par Claude (voir la
      # dernière étape) — sans quoi son commit ne serait testé par rien.
      actions: write
    steps:
      - name: Vérifier la présence de la clé API
        id: guard
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY absent — @claude désactivé."
          fi

      - uses: actions/checkout@v6
        if: steps.guard.outputs.enabled == 'true'
        with:
          fetch-depth: 0

      # SHA de départ, pour détecter après coup si Claude a poussé un correctif.
      - name: Relever le SHA avant intervention
        id: before
        if: steps.guard.outputs.enabled == 'true'
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Chaîne d'outils : sans elle Claude ne peut ni lancer les tests avant de
      # pousser, ni vérifier son propre correctif. C'est la différence entre un
      # agent qui agit et un agent qui propose.
      - name: Set up Node.js
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: steps.guard.outputs.enabled == 'true'
        run: npm ci
        working-directory: frontend

      - name: Set up Python
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        if: steps.guard.outputs.enabled == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Pas de `prompt:` ici : sans lui l'action tourne en mode interactif et
      # prend le commentaire de l'utilisateur comme instruction.
      - uses: anthropics/claude-code-action@v1
        if: steps.guard.outputs.enabled == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Voir claude-review.yml : évite d'exiger l'App GitHub Claude.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          trigger_phrase: "@claude"
          track_progress: true
          claude_args: |
            --model claude-opus-5
            --max-turns 60

      # Un commit poussé avec GITHUB_TOKEN ne déclenche aucun workflow : sans ce
      # relais, le correctif de Claude ne serait testé par rien et la PR
      # resterait au vert du HEAD précédent. Même mécanisme que dans
      # pr-merge-main-prefer-head-data.yml.
      - name: Relancer la CI si Claude a poussé un correctif
        # Les trois déclencheurs n'exposent pas le même objet : `issue_comment`
        # remplit `event.issue`, tandis que `pull_request_review_comment` et
        # `pull_request_review` remplissent `event.pull_request`. Ne tester que
        # le premier sauterait le relais pour un `@claude` écrit dans un
        # commentaire de revue — même expression que le `concurrency` plus haut.
        if: >-
          steps.guard.outputs.enabled == 'true'
          && (github.event.issue.pull_request || github.event.pull_request)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ steps.before.outputs.sha }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          set -euo pipefail
          BRANCH=$(gh pr view "$PR_NUMBER" --json headRefName --jq .headRefName)
          git fetch origin "$BRANCH" --quiet
          AFTER=$(git rev-parse "origin/$BRANCH")
          if [ "$AFTER" = "$BEFORE" ]; then
            echo "Aucun commit poussé par Claude — rien à relancer."
            exit 0
          fi
          echo "Correctif détecté ($BEFORE -> $AFTER) — relance de la CI sur $BRANCH."
          gh workflow run ci.yml --ref "$BRANCH" \
            || echo "::warning::Dispatch CI impossible — vérifier que ci.yml (avec workflow_dispatch) est sur main."
