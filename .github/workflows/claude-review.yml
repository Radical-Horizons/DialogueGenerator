# Revue automatique à l'ouverture d'une PR, via les reviewers spécialisés du dépôt
# (`.claude/agents/`, générés depuis `.cursor/agents/` par `npm run harness:sync`).
#
# Volontairement PAS déclenché sur `synchronize` : re-reviewer à chaque push noie
# la PR sous les commentaires. Pour relancer une revue après corrections, écrire
# `@claude relance la revue` en commentaire (voir claude-mention.yml).
#
# Prérequis : secret de dépôt `ANTHROPIC_API_KEY`. En son absence le job se
# termine en succès sans rien faire — aucune PR n'est bloquée.
name: Claude — revue de PR

on:
  pull_request:
    types: [opened, ready_for_review]
    branches: [main, dev]
    # `*.md` et non `**/*.md` : voir l'explication dans ci.yml — `**` traverse
    # les `/` et exclurait tout le harnais `.cursor/` / `.claude/` de la revue.
    paths-ignore:
      - "data/GDD_categories/**"
      - "data/Vision.json"
      - "docs/**"
      - "*.md"

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Les PR en brouillon ne sont revues qu'au passage en « ready for review ».
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      # `secrets` n'est pas utilisable dans un `if:` de job — on le teste ici et
      # on conditionne l'étape suivante, pour que l'absence de clé donne un job
      # vert silencieux plutôt qu'un échec rouge à chaque PR.
      - name: Vérifier la présence de la clé API
        id: guard
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY absent — revue Claude désactivée."
          fi

      - uses: actions/checkout@v6
        if: steps.guard.outputs.enabled == 'true'
        with:
          fetch-depth: 0

      # Sans cette chaîne d'outils, `--allowedTools` autorise `npm run lint` et
      # `vitest` mais ils échouent en `eslint: not found` (exit 127) : le prompt
      # exige alors une preuve exécutée qu'il rend impossible, ce qui pousse
      # mécaniquement vers les findings spéculatifs qu'il interdit par ailleurs.
      # ~1 min de plus par revue, contre des findings vérifiables.
      - name: Set up Node.js
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: steps.guard.outputs.enabled == 'true'
        run: npm ci
        working-directory: frontend

      - name: Set up Python
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        if: steps.guard.outputs.enabled == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - uses: anthropics/claude-code-action@v1
        if: steps.guard.outputs.enabled == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Sans `github_token`, l'action échange un jeton OIDC contre un token
          # d'App et exige que l'App GitHub Claude soit installée sur le dépôt
          # (sinon : 401 « Claude Code is not installed on this repository »).
          # Le GITHUB_TOKEN du workflow suffit et évite cette installation.
          # Contrepartie : les commentaires sont signés github-actions[bot].
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE: ${{ github.event.pull_request.base.ref }}

            Tu revois cette PR sur DialogueGenerator (FastAPI + React/Zustand).
            La branche est déjà checkoutée dans le répertoire courant.
            Réponds en français.

            ## Méthode — suis `.claude/commands/pr-review.md`

            1. Établis le diff : `git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD`.
            2. Ignore `data/GDD_categories/` et `data/Vision.json` : données GDD
               synchronisées depuis Notion, pas du code à reviewer.
            3. Lance EN PARALLÈLE, via l'outil Task, uniquement les sous-agents
               dont le périmètre est touché — la table de routage est dans
               `.claude/commands/pr-review.md`. N'en lance pas un généraliste
               en plus. Sur un diff qui touche 1 seul domaine, 1 seul agent.
            4. Synthétise : doublons fusionnés, findings ancrés en `chemin:ligne`.

            ## Conventions du dépôt à faire respecter

            Lis `AGENTS.md` avant de conclure. En particulier :
            - `mergeNodeFormIntoStoreData()` / `mergeDialogueNodeFormIntoStoreData()`
              au lieu d'un spread `{ ...nodeData, ...formValues }` dans le flush
              de `NodeEditorPanel` — le spread écrase `choices[N].targetNode`.
            - Communication inter-composants du graphe via `useGraphViewStore`,
              jamais `window` + CustomEvent.
            - Logique métier dans `services/`, DI via `api/container.py` ;
              `config_manager.py` racine est déprécié.
            - Baseline ESLint à zéro erreur ; pas de nouveau `eslint-disable`.
            - Tout fix de bug non trivial appelle un test de régression.

            ## Ce qu'on ne veut PAS

            - Pas de reformulation du diff ni de résumé de ce que fait la PR.
            - Pas de nitpick de style : ESLint et la CI s'en chargent déjà.
            - Pas de finding spéculatif « au cas où ». Si tu n'es pas sûr d'un
              problème, vérifie-le (lis les appelants, `grep` le motif, lance le
              test ciblé) avant de l'écrire. Un finding non vérifié coûte plus
              cher qu'un finding manquant.
            - Si le diff est propre, dis-le en deux lignes et arrête-toi.

            ## Sortie

            Un seul commentaire de synthèse via `gh pr comment`, structuré en
            Bloquant / À corriger / Suggestion (omets les sections vides).
            Utilise `mcp__github_inline_comment__create_inline_comment`
            (avec `confirmed: true`) pour les problèmes ancrés sur une ligne
            précise. Ne rends aucun texte de revue hors commentaire GitHub.

          claude_args: |
            --model claude-opus-5
            --max-turns 40
            --allowedTools "Task,Read,Grep,Glob,Bash(git:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(npx vitest run:*),Bash(npm --prefix frontend run lint),Bash(python -m pytest:*),mcp__github_inline_comment__create_inline_comment"
