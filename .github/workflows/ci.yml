name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Tests (Python)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest tests/ \
            -m "not slow and not integration" \
            --ignore=tests/integration \
            --deselect tests/api/test_context.py::TestEstimateTokens::test_estimate_tokens \
            --deselect tests/api/test_context_retrieval_integration.py::TestContextRetrievalIntegration::test_retrieve_fiches_and_build_prompt \
            --deselect tests/api/test_vocabulary.py::TestVocabularyEndpoints::test_get_vocabulary_success \
            --deselect tests/api/test_vocabulary.py::TestVocabularyEndpoints::test_get_vocabulary_with_min_popularite \
            --deselect tests/api/test_vocabulary.py::TestVocabularyEndpoints::test_get_vocabulary_stats \
            --deselect tests/api/test_vocabulary.py::TestNarrativeGuidesEndpoints::test_get_narrative_guides_success \
            --deselect tests/api/utils/test_sentry_config.py::TestSentryConfig::test_init_sentry_with_dsn_prod \
            --deselect tests/core/llm/openai/test_parameter_builder.py::TestOpenAIParameterBuilder::test_build_responses_params_with_streaming \
            --deselect tests/services/test_cost_governance_service.py::test_check_budget_allowed_under_90_percent \
            --deselect tests/services/test_cost_governance_service.py::test_check_budget_soft_warning_at_90_percent \
            --deselect tests/services/test_cost_governance_service.py::test_check_budget_hard_block_at_100_percent \
            --deselect tests/services/test_cost_governance_service.py::test_check_budget_hard_block_over_100_percent \
            --deselect tests/services/test_cost_governance_service.py::test_get_budget_status \
            --deselect tests/services/test_graph_generation_service.py::test_generate_nodes_for_all_choices_basic \
            --deselect tests/services/test_graph_generation_service.py::test_generate_nodes_for_all_choices_filters_connected \
            --deselect tests/services/test_graph_generation_service.py::test_generate_nodes_for_all_choices_id_format \
            --deselect tests/services/test_unity_dialogue_orchestrator.py::test_orchestrator_cancellation \
            --deselect tests/services/test_unity_dialogue_orchestrator.py::test_orchestrator_generate_rest_usage \
            --deselect tests/services/test_unity_dialogue_orchestrator.py::test_orchestrator_validation_error \
            --deselect tests/test_context_builder.py::TestContextBuilderGDDLoading::test_load_gdd_files_with_missing_category_file \
            --tb=short -q
        env:
          ENVIRONMENT: development
          OPENAI_API_KEY: sk-test-dummy-key-for-ci

  frontend-checks:
    name: Frontend (Build + Test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: TypeScript build check
        run: npm run build
        working-directory: frontend

      - name: Lint (non-blocking)
        continue-on-error: true
        run: npx eslint . --ext ts,tsx --report-unused-disable-directives
        working-directory: frontend

      - name: Unit tests (Vitest)
        run: |
          npx vitest --run \
            --exclude 'src/__tests__/PresetSelector.test.tsx' \
            --exclude 'src/__tests__/SaveStatusIndicator.test.tsx' \
            --exclude 'src/__tests__/ChoiceEditor.4results.test.tsx' \
            --exclude 'src/components/generation/GenerationOptionsModal.test.tsx' \
            --exclude 'src/components/generation/__tests__/GenerationPanel.integration.test.tsx' \
            --exclude 'src/components/layout/Dashboard.test.tsx'
        working-directory: frontend

  quality-gate:
    name: Quality Gate
    needs: [backend-tests, frontend-checks]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.backend-tests.result }}" != "success" ] || \
             [ "${{ needs.frontend-checks.result }}" != "success" ]; then
            echo "One or more checks failed"
            exit 1
          fi
          echo "All checks passed"
