# CI minimal : tests backend + frontend sur les PR.
# Déclenché sur pull_request vers main (et push sur main pour le statut).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Actions internes (checkout/setup-*) : compat Node 24 sur les runners GitHub (changelog 2025-09).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        env:
          ENVIRONMENT: development
          JWT_SECRET_KEY: ci-dummy-secret
          OPENAI_API_KEY: sk-dummy
        run: python -m pytest tests/ -v --tb=short

  frontend:
    name: Frontend (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run tests (full Vitest suite)
        env:
          VITEST_FULL: "1"
        run: npx vitest run --max-workers=2
        working-directory: frontend
