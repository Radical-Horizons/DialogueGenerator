# CI : PR = tiers T2 (pytest hors slow, Vitest sans VITEST_FULL) ; push main = T3 complet.
# Déclenché sur pull_request vers main (et push sur main pour le statut).
name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]

# Actions internes (checkout/setup-*) : compat Node 24 sur les runners GitHub (changelog 2025-09).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests (PR — hors slow, tier T2)
        if: github.event_name == 'pull_request'
        env:
          ENVIRONMENT: development
          JWT_SECRET_KEY: ci-dummy-secret
          OPENAI_API_KEY: sk-dummy
        run: python -m pytest tests/ -m "not slow" -v --tb=short

      - name: Run tests (push main — suite complète, tier T3)
        if: github.event_name == 'push'
        env:
          ENVIRONMENT: development
          JWT_SECRET_KEY: ci-dummy-secret
          OPENAI_API_KEY: sk-dummy
        run: python -m pytest tests/ -v --tb=short

  frontend:
    name: Frontend (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run Vitest (PR — suite rapide, tier T2)
        if: github.event_name == 'pull_request'
        run: npx vitest run --max-workers=2
        working-directory: frontend

      - name: Run Vitest (push main — suite complète, tier T3)
        if: github.event_name == 'push'
        env:
          VITEST_FULL: "1"
        run: npx vitest run --max-workers=2
        working-directory: frontend

  pwa:
    name: PWA installability
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run PWA Playwright smoke
        env:
          ENVIRONMENT: development
          JWT_SECRET_KEY: ci-dummy-secret
          OPENAI_API_KEY: sk-dummy
        run: npm run test:e2e:pwa
