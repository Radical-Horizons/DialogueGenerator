# CI : PR = tiers T2 (pytest hors slow, Vitest sans VITEST_FULL) ; push main = T3 complet.
# Déclenché sur pull_request vers main (et push sur main pour le statut).
# Actions checkout/setup-* @v6 : runtime Node 24 (changelog GitHub 2025-09).
name: CI

on:
  pull_request:
    branches: [main, dev]
    # Une PR qui ne touche QUE de la doc ou des données GDD synchronisées depuis
    # Notion n'a rien à faire tourner. `paths-ignore` déclenche dès qu'un seul
    # fichier sort de cette liste : une PR mixte code+GDD lance bien la CI.
    #
    # `*.md` et NON `**/*.md` : dans les filtres GitHub, `**` traverse les `/`,
    # donc `**/*.md` matcherait tout le harnais `.claude/` (agents, commandes,
    # règles), qui est intégralement en markdown. Une PR ne touchant que des
    # prompts d'agents ne déclencherait alors aucun run.
    paths-ignore:
      - "data/GDD_categories/**"
      - "data/Vision.json"
      - "docs/**"
      - "*.md"
  push:
    branches: [main]
  # Rattrape le trou laissé par pr-merge-main-prefer-head-data.yml et les
  # workflows Claude : un push fait avec GITHUB_TOKEN ne crée pas de nouveau
  # run, donc le commit poussé ne serait jamais testé. Ils relancent la CI
  # explicitement via ce déclencheur (tier T2).
  workflow_dispatch:

concurrency:
  # Sur PR, seul le dernier push compte. Sur main, on ne coupe rien : la suite T3
  # est la porte de release (`.claude/rules/ci_before_push.md`).
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    # Nom inchangé volontairement : c'est l'identifiant du check requis en protection
    # de branche. Le renommer ferait attendre indéfiniment un check qui ne remonte plus.
    # Ce job couvre désormais ESLint *et* tsc.
    name: Frontend lint (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      # Baseline documentée : zéro erreur (CLAUDE.md, `.claude/rules/frontend.md`).
      # Jusqu'ici la règle n'existait que dans les prompts d'agents, sans
      # vérification en CI — toute régression passait donc inaperçue.
      - name: ESLint
        run: npm run lint
        working-directory: frontend

      # `vite build` transpile via esbuild sans vérifier les types, et Vitest ne
      # typecheck pas : sans cette étape, aucun job ne lit `tsconfig.json`. Des erreurs
      # s'accumulaient donc en silence — 119 au moment de l'ajout, dont des imports vers
      # un paquet absent (`@xyflow/react`), des tokens de thème inexistants rendus
      # `undefined`, et une action de toast branchée sur une clé ignorée.
      # `include: ["src"]` couvre les fichiers de test au même titre que le code.
      - name: TypeScript (tsc --noEmit)
        run: npm run typecheck
        working-directory: frontend

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    # Durées observées sur PR : 34 et 36 min. 90 min laisse une marge large
    # si la suite s'alourdit, tout en évitant qu'un job bloqué occupe un
    # runner jusqu'à la limite par défaut de 6 h.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests (PR / dispatch — hors slow, tier T2)
        if: github.event_name != 'push'
        env:
          ENVIRONMENT: development
          JWT_SECRET_KEY: ci-dummy-secret
          OPENAI_API_KEY: sk-dummy
          PROMETHEUS_ENABLED: "false"
        run: python -m pytest tests/ -m "not slow" -v --tb=short

      - name: Run tests (push main — suite complète, tier T3)
        if: github.event_name == 'push'
        env:
          ENVIRONMENT: development
          JWT_SECRET_KEY: ci-dummy-secret
          OPENAI_API_KEY: sk-dummy
          PROMETHEUS_ENABLED: "false"
        run: python -m pytest tests/ -v --tb=short

  frontend:
    name: Frontend (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run Vitest (PR / dispatch — suite rapide, tier T2)
        if: github.event_name != 'push'
        run: npx vitest run --max-workers=2
        working-directory: frontend

      - name: Run Vitest (push main — suite complète, tier T3)
        if: github.event_name == 'push'
        env:
          VITEST_FULL: "1"
        run: npx vitest run --max-workers=2
        working-directory: frontend

  pwa:
    name: PWA installability
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json', 'frontend/package-lock.json') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 25
        run: npx playwright install --with-deps chromium

      - name: Build frontend (PWA prod smoke)
        run: npm run build
        working-directory: frontend

      - name: Run PWA Playwright smoke
        env:
          ENVIRONMENT: development
          JWT_SECRET_KEY: ci-dummy-secret
          OPENAI_API_KEY: sk-dummy
        run: npm run test:e2e:pwa

  e2e-auth:
    name: Auth E2E (guest-first /login)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json', 'frontend/package-lock.json') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 25
        run: npx playwright install --with-deps chromium

      - name: Run auth Playwright smoke
        env:
          ENVIRONMENT: development
          JWT_SECRET_KEY: ci-dummy-secret
          ADMIN_PASSWORD: admin123
          OPENAI_API_KEY: sk-dummy
          CI: "true"
        run: npm run test:e2e:auth
