# Surcharge projet DialogueGenerator pour bmad-create-story (cycle BMAD 6.10, remplacé par bmad-build).
#
# Gardée tant que le skill reste installé : il charge {planning_artifacts}/*ux*/*.md et *architecture*/*.md, donc
# la spec ux-design-specification/ et planning-artifacts/architecture/ (v10), remplacées par la refonte « Scène »
# (readiness du 2026-11-20, constat B3). Consignes : .claude/rules/ui_refonte_scene.md (« Coder une story »),
# partagées avec bmad-build.toml et bmad-dev-auto.toml.
#
# Les tableaux persistent_facts s'ajoutent à ceux du skill (project-context.md reste chargé).

[workflow]

persistent_facts = [
  "file:{project-root}/.claude/rules/ui_refonte_scene.md",
  "file:{project-root}/docs/design/refonte-scene/README.md",
  "file:{project-root}/docs/architecture/refonte-scene-architecture.md",
]
